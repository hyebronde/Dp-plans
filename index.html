<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DP Plans</title>
<meta name="description" content="วางแผนไฟ กล้อง และช็อตจากมุมบน สำหรับช่างภาพและทีมถ่ายทำ">
<meta name="theme-color" content="#8E8F8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DP Plans">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --frost:radial-gradient(90% 50% at 20% 0%, #9C9D9A 0%, rgba(156,157,154,0) 70%), radial-gradient(80% 50% at 95% 55%, #C8D3A2 0%, rgba(200,211,162,0) 70%), linear-gradient(180deg, #8E8F8C 0%, #BFC2AE 55%, #DCD6C4 100%);
  --bg:#BFC2AE; --surface:#F6F3EC; --surface2:#ECE7DD; --line:#ddd6c8; --text:#1C1C1F; --muted:#5b5a55;
  --accent:#2B2B2E; --accent-ink:#ffffff; --accent-soft:#E5D6FF; --lilac:#E5D6FF; --violet:#7B5CE0;
  --glass:rgba(255,255,255,.28); --glass-ink:#1C1C1F; --smoke:linear-gradient(180deg,#3B3A3C 0%,#4A403F 100%);
  --irid:radial-gradient(70% 90% at 10% 20%, #FFB067 0%, rgba(255,176,103,0) 60%), radial-gradient(60% 90% at 95% 60%, #7FA8FF 0%, rgba(127,168,255,0) 70%), radial-gradient(60% 80% at 50% 100%, #E9C9F0 0%, rgba(233,201,240,0) 70%), #EDE4EE;
  --paper:#F6F3EC; --shadow:0 10px 30px rgba(40,38,30,.12);
  --r:28px; --font:Anuphan,'IBM Plex Sans Thai',Thonburi,'Noto Sans Thai',system-ui,sans-serif; --head:Outfit,Anuphan,sans-serif; --dot:Doto,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --frost:radial-gradient(90% 50% at 20% 0%, #3a3b3e 0%, rgba(58,59,62,0) 70%), radial-gradient(80% 50% at 95% 55%, #3c4232 0%, rgba(60,66,50,0) 70%), linear-gradient(180deg, #1d1d20 0%, #26272a 55%, #2d2b28 100%);
    --bg:#1d1d20; --surface:#2a292c; --surface2:#353437; --line:#403e42; --text:#F2F2F4; --muted:#b4b1ab;
    --accent:#F2F2F4; --accent-ink:#1C1C1F; --accent-soft:#4a3f66; --glass:rgba(255,255,255,.1); --glass-ink:#F2F2F4;
    --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --frost:radial-gradient(90% 50% at 20% 0%, #3a3b3e 0%, rgba(58,59,62,0) 70%), radial-gradient(80% 50% at 95% 55%, #3c4232 0%, rgba(60,66,50,0) 70%), linear-gradient(180deg, #1d1d20 0%, #26272a 55%, #2d2b28 100%);
  --bg:#1d1d20; --surface:#2a292c; --surface2:#353437; --line:#403e42; --text:#F2F2F4; --muted:#b4b1ab;
  --accent:#F2F2F4; --accent-ink:#1C1C1F; --accent-soft:#4a3f66; --glass:rgba(255,255,255,.1); --glass-ink:#F2F2F4;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:#e5484d}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:active{transform:scale(.97)}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center}
.ib:hover{background:var(--surface2)}
.ib:disabled{opacity:.3}
.ib svg,.tool svg{width:22px;height:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
small{font-size:12px}

/* ---------- home ---------- */
#home{min-height:100%;padding:calc(env(safe-area-inset-top) + 18px) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));max-width:1200px;margin:0 auto}
.home-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand img{width:38px;height:38px;border-radius:10px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.pcard .cover{aspect-ratio:16/10;background:var(--paper);display:block;width:100%;object-fit:cover;border-bottom:1px solid var(--line)}
.pcard .meta{padding:12px 14px}
.pcard b{font-size:16px;display:block}
.pcard .acts{display:flex;gap:6px;padding:0 10px 12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:34px 22px;text-align:center}
.empty h2{margin:.2em 0 .3em;font-size:20px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:20px 0 6px;text-align:left}
.feat div{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13px}
.feat b{display:block;font-size:14px;margin-bottom:2px}

/* ---------- editor ---------- */
#editor{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;background:var(--bg)}
.ed-top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.scene-btn{border:0;background:transparent;text-align:left;padding:4px 8px;border-radius:10px;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.scene-btn:hover{background:var(--surface2)}
.scene-btn small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.scene-btn span{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.ed-main{position:relative;display:grid;grid-template-columns:1fr 360px;min-height:0}
#stage{position:relative;overflow:hidden;background:var(--paper);min-height:0}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#tools{position:absolute;left:max(10px,env(safe-area-inset-left));top:10px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow);max-height:calc(100% - 20px);overflow:auto;scrollbar-width:none}
.tool{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--text);position:relative}
.tool:hover{background:var(--surface2)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.tsep{height:1px;background:var(--line);margin:4px 6px}
#zoom{position:absolute;right:10px;top:10px;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
#zoom button{border:0;background:transparent;min-width:36px;height:34px;border-radius:8px;font-weight:600}
#zoom button:hover{background:var(--surface2)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:rgba(20,20,22,.82);color:#fff;font-size:13px;padding:7px 12px;border-radius:999px;pointer-events:none;max-width:calc(100% - 140px);text-align:center}
#hint:empty{display:none}
.hint-act{pointer-events:auto}

/* panel */
#panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex:none}
.ptabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;color:var(--muted);font-size:14px}
.ptabs button.on{background:var(--surface2);color:var(--text)}
.ptabs .grab{display:none}
.pbody{overflow:auto;padding:14px;flex:1;min-height:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.pbody h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.pbody h4{margin:18px 0 8px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px}
.fld>span{color:var(--muted);display:flex;justify-content:space-between}
.fld>span b{color:var(--text);font-weight:600}
.fld input:not([type=range]):not([type=checkbox]),.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px;font-size:15px;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk input{width:20px;height:20px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.chipk{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.chipk button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600}
.chipk button i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat div{background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat b{font-size:20px;display:block;line-height:1.2}
.stat small{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:8px;text-align:left;width:100%}
.li.on{border-color:var(--accent);background:var(--accent-soft)}
.li .sw{width:14px;height:14px;border-radius:50%;flex:none}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:14px}
.li .grow small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center}
.shot .th{width:96px;aspect-ratio:16/9;border-radius:8px;background:#ddd center/cover no-repeat;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;position:relative;overflow:hidden}
.shot .th em{position:absolute;left:5px;top:5px;font-style:normal;background:rgba(0,0,0,.55);border-radius:6px;padding:0 5px;font-size:12px}
.shot .grow b{display:flex;align-items:center;gap:6px}
.shot .grow p{margin:2px 0 0;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.insp-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.insp-head .ico{width:42px;height:42px;border-radius:10px;background:var(--paper);border:1px solid var(--line);flex:none}
.insp-head b{display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}

/* modal */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s}
.modal.wide{width:min(820px,100%)}
.modal h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.modal h3 .x{margin-left:auto}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
@media (max-width:620px){.mback{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0;max-height:88%;padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
.libtabs{display:flex;gap:4px;overflow:auto;margin-bottom:12px;scrollbar-width:none}
.libtabs button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.libtabs button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.libgrid button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#2a2a2e;line-height:1.25;text-align:center}
.libgrid button svg{width:56px;height:56px}
.libgrid button small{color:#8a8780}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exgrid button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;text-align:left;font-weight:600}
.exgrid button small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.exgrid button.main{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.exgrid button.main small{color:inherit;opacity:.8}
.preview{background:var(--surface2);border-radius:12px;padding:10px;margin-bottom:12px;display:grid;place-items:center;min-height:120px}
.preview canvas,.preview img{max-width:100%;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff}
.ready{margin-top:12px;background:var(--accent-soft);border-radius:12px;padding:12px}
.ready b{display:block;margin-bottom:8px}
.photo-box{border:1px dashed var(--line);border-radius:12px;aspect-ratio:16/9;display:grid;place-items:center;background:var(--surface2) center/cover no-repeat;margin-bottom:10px;position:relative;overflow:hidden}
.photo-box .row{position:absolute;bottom:8px;right:8px}
.kitrow{display:grid;grid-template-columns:1.6fr 1fr .8fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.kitrow input,.kitrow select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 8px;font-size:14px;min-width:0}
.kithead{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1c1c1f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}


/* ---------- Frost Pastel ---------- */
html,body{background:var(--bg)}
body{background:var(--frost);background-attachment:fixed;min-height:100%}
.btn{border:0;background:var(--glass);color:var(--glass-ink);border-radius:999px;padding:11px 18px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--glass)}
.btn.sm{padding:8px 13px;border-radius:999px}
.pbody .btn,.modal .btn{background:var(--surface2);color:var(--text)}
.pbody .btn.primary,.modal .btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#c4302b}
.logo-orb{width:44px;height:44px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:radial-gradient(70% 70% at 30% 30%,#FFD08A 0%,#FF8A2B 35%,rgba(255,138,43,0) 70%),radial-gradient(100% 100% at 80% 80%,#8CC4FF 0%,#2F6BFF 45%,#1B3FB8 100%)}
.logo-orb::before{content:"";position:absolute;inset:0;background:#fff;opacity:.92;clip-path:polygon(50% 50%,96% 28%,100% 50%,96% 72%)}
.logo-orb::after{content:"";position:absolute;left:42%;top:42%;width:16%;height:16%;border-radius:50%;background:#fff}
.brand{font-family:var(--head);font-weight:400;font-size:24px;color:#fff;letter-spacing:-.5px}
.brand small{color:rgba(255,255,255,.85);font-family:var(--font)}
.home-hero{font-family:var(--head);font-weight:300;font-size:clamp(40px,7vw,64px);color:#fff;margin:6px 0 18px;line-height:1.05;display:flex;align-items:center;gap:12px}
.home-hero i{display:inline-block;width:2px;height:.9em;background:#fff;position:relative}
.home-hero i::before{content:"";position:absolute;top:-6px;left:-4px;width:10px;height:10px;border-radius:50%;background:#fff}
.pcard{border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.pcard:nth-child(3n+1){background:var(--smoke);color:#fff}
.pcard:nth-child(3n+1) .muted{color:#d9d6d2}
.pcard:nth-child(3n+2){background:var(--irid)}
.pcard .cover{border-bottom:0;border-radius:calc(var(--r) - 8px);margin:8px;width:calc(100% - 16px);background:var(--paper)}
.pcard b{font-family:var(--head);font-weight:500;font-size:20px}
.empty{background:var(--smoke);color:#fff;border:0;border-radius:36px}
.empty .muted{color:#e7e4df}
.empty h2{font-family:var(--dot);font-weight:900;font-size:34px;letter-spacing:1px}
.feat div{background:rgba(255,255,255,.1);border-radius:22px;color:#f2f2f4}
.empty .btn{background:rgba(255,255,255,.16);color:#fff}
.empty .btn.primary{background:#fff;color:#1C1C1F}
#editor{background:var(--frost)}
.ed-top{background:transparent;border-bottom:0}
.ed-top .ib{background:var(--glass);border-radius:50%;width:46px;height:46px;color:var(--glass-ink)}
.scene-btn small{color:var(--glass-ink);opacity:.75}
.scene-btn span{font-family:var(--head);font-weight:400;font-size:19px;color:var(--glass-ink)}
.scene-btn:hover{background:var(--glass)}
.ed-main{padding:0 max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left));gap:10px}
#stage{border-radius:32px;box-shadow:var(--shadow)}
#tools{background:#2B2B2E;border:0;border-radius:30px;padding:6px;box-shadow:var(--shadow)}
.tool{border-radius:50%;color:#fff}
.tool:hover{background:rgba(255,255,255,.1)}
.tool.on{background:#fff;color:#1C1C1F}
.tool .dot{border-color:#2B2B2E;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.tsep{background:rgba(255,255,255,.15)}
#zoom{background:#2B2B2E;border:0;border-radius:999px;color:#fff}
#zoom button{color:#fff;border-radius:999px}
#zoom button:hover{background:rgba(255,255,255,.1)}
#hint{background:#2B2B2E;border-radius:999px}
#panel{border:0;border-radius:32px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.ptabs{border-bottom:0;gap:6px;padding:10px}
.ptabs button{border-radius:999px;color:var(--muted);font-weight:500;padding:9px 4px}
.ptabs button.on{background:var(--accent);color:var(--accent-ink)}
.pbody h3{font-family:var(--head);font-weight:400;font-size:22px}
.pbody h4{font-family:var(--dot);font-weight:900;font-size:15px;letter-spacing:.06em;color:var(--text)}
.fld input:not([type=range]):not([type=checkbox]),.fld select,.fld textarea{border:0;background:var(--surface2);border-radius:16px}
.fld input[type=range]{accent-color:var(--text)}
.fld.chk input{accent-color:var(--text)}
.li{border-radius:22px;background:var(--surface2)}
.li.on{border-color:var(--violet);background:var(--lilac)}
.shot .th{border-radius:14px}
.stat div{border-radius:22px;background:var(--smoke);color:#fff}
.stat b{font-family:var(--dot);font-weight:900;font-size:24px}
.stat small{color:#d9d6d2}
.note{border-radius:20px}
.chipk button{border:0;background:var(--surface2)}
.modal{border-radius:32px;background:var(--surface)}
.modal h3{font-family:var(--head);font-weight:400;font-size:24px}
.libtabs button{border:0;background:var(--surface2);padding:8px 14px}
.libtabs button.on{background:var(--accent);color:var(--accent-ink)}
.libgrid button{border:0;border-radius:22px;background:var(--paper)}
.libgrid button b{font-weight:600;font-size:13px}
.libtop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.libtop .seg{margin:0;flex:1 1 320px}
.libq{flex:1 1 220px;border:0;background:var(--surface2);border-radius:999px;padding:10px 16px;font-size:15px;min-width:0}
.seg{border-radius:999px}
.seg button{border-radius:999px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.exgrid button{border:0;border-radius:24px}
.exgrid button.main{background:var(--irid);color:#1C1C1F}
.preview{border-radius:24px}
.ready{border-radius:22px}
.refs{display:flex;flex-direction:column;gap:12px}
.ref{background:var(--surface2);border-radius:24px;padding:8px}
.ref-img{position:relative;border-radius:18px;overflow:hidden;line-height:0}
.ref-img img{width:100%;display:block}
.ref-marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ref-main{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.88);color:#1C1C1F;border-radius:999px;padding:3px 10px;font-size:12px;line-height:1.5}
.pal{display:flex;height:18px;border-radius:999px;overflow:hidden;margin:8px 0}
.pal i{flex:1}
.ref-note{width:100%;border:0;background:var(--surface);border-radius:14px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.mark-wrap{position:relative;border-radius:18px;overflow:hidden;line-height:0;touch-action:none}
.mark-wrap img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.mark-wrap svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.swb{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swb.on{box-shadow:0 0 0 3px var(--text)}
.ref .btn{background:var(--surface)}
.snaps{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.snaps .fld{margin-bottom:6px}
.snaps span{color:var(--text)}
#toast{background:#2B2B2E;border-radius:999px}
@media (max-width:820px){
  .ed-main{grid-template-columns:1fr}
  #panel{position:absolute;left:0;right:0;bottom:0;max-height:56%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15);z-index:5}
  #panel.min .pbody{display:none}
  #panel.min .ptabs{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .ptabs{border-bottom:0;position:relative;padding-top:14px}
  .ptabs .grab{display:block;position:absolute;top:5px;left:50%;width:38px;height:4px;border-radius:4px;background:var(--line);transform:translateX(-50%);padding:0;flex:none}
  #hint{bottom:auto;top:58px}
  .exgrid{grid-template-columns:1fr}
  .kitrow{grid-template-columns:1fr 1fr;}
  .kithead{display:none}
}
</style>
</head>
<body>

<section id="home">
  <header class="home-top">
    <div class="brand"><span class="logo-orb" aria-hidden="true"></span><div>dp plans<small>วางไฟ · วางกล้อง · บล็อกช็อต จากมุมบน</small></div></div>
    <div class="sp"></div>
    <button class="btn ghost" id="btnImport">นำเข้าไฟล์โปรเจกต์</button>
    <button class="btn primary" id="btnNew">+ โปรเจกต์ใหม่</button>
  </header>
  <div class="home-hero">แผนของคุณ<i aria-hidden="true"></i></div>
  <div id="projList"></div>
</section>

<section id="editor" hidden>
  <header class="ed-top">
    <button class="ib" id="btnHome" title="โปรเจกต์ทั้งหมด" aria-label="กลับ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="scene-btn" id="btnScenes"><small id="projName"></small><span id="sceneName"></span></button>
    <div class="sp"></div>
    <button class="ib" id="btnUndo" title="ย้อนกลับ" aria-label="ย้อนกลับ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button class="ib" id="btnRedo" title="ทำซ้ำ" aria-label="ทำซ้ำ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
    <button class="btn primary" id="btnExport">ส่งออก</button>
  </header>
  <div class="ed-main">
    <div id="stage">
      <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
      <nav id="tools"></nav>
      <div id="zoom"><button data-z="out" aria-label="ซูมออก">−</button><button data-z="fit">พอดี</button><button data-z="in" aria-label="ซูมเข้า">+</button></div>
      <div id="hint"></div>
    </div>
    <aside id="panel" class="min">
      <div class="ptabs"><span class="grab"></span>
        <button data-tab="shots">ช็อต</button><button data-tab="lights">ไฟ &amp; กริป</button><button data-tab="refs">Ref</button><button data-tab="scene">ซีน</button>
      </div>
      <div class="pbody"></div>
    </aside>
  </div>
</section>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
